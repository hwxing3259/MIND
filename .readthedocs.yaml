# Read the Docs build configuration.
# https://docs.readthedocs.io/en/stable/config-file/v2.html
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.11"
  jobs:
    pre_install:
      # PyPI's default Linux torch wheel bundles CUDA (~2.5 GB) and blows past
      # Read the Docs' build resource limits. Install the CPU-only build first;
      # the `.[docs]` install below then finds torch~=2.2 already satisfied.
      - pip install --extra-index-url https://download.pytorch.org/whl/cpu "torch~=2.2"

python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - docs

sphinx:
  configuration: docs/conf.py
  # Mirrors the `-W` used by the docs job in .github/workflows/ci.yml.
  fail_on_warning: true

formats:
  - pdf
  - htmlzip
